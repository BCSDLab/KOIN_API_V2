jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token:
    expiration-time: ${JWT_ACCESS_TOKEN_EXPIRATION_TIME}

spring:
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  lifecycle:
    timeout-per-shutdown-phase: 5s
  servlet:
    multipart:
      max-request-size: 10MB
      max-file-size: 10MB

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
    hibernate:
      ddl-auto: validate

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
    mongodb:
      uri: ${MONGODB_URI}

  thymeleaf:
    prefix: "classpath:/mail/"
    suffix: ".html"

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

server:
  tomcat:
    max-http-form-post-size: 10MB
  lifecycle:
    timeout-per-shutdown-phase: 5s

swagger:
  server-url: ${SWAGGER_SERVER_URL}

aws:
  ses:
    access-key: ${AWS_SES_ACCESS_KEY}
    secret-key: ${AWS_SES_SECRET_KEY}

s3:
  bucket: ${S3_BUCKET}
  custom_domain: ${S3_CUSTOM_DOMAIN}

slack:
  koin_event_notify_url: ${SLACK_KOIN_EVENT_NOTIFY_URL}
  koin_owner_event_notify_url: ${SLACK_KOIN_OWNER_EVENT_NOTIFY_URL}
  koin_shop_review_notify_url: ${SLACK_KOIN_SHOP_REVIEW_NOTIFY_URL}
  koin_lost_item_notify_url: ${SLACK_KOIN_LOST_ITEM_NOTIFY_URL}
  logging:
    error: ${SLACK_LOGGING_ERROR_URL}

koin:
  admin:
    shop:
      url: ${KOIN_ADMIN_SHOP_URL}
    review:
      url: ${KOIN_ADMIN_REVIEW_URL}

OPEN_API_KEY_PUBLIC: ${OPEN_API_KEY_PUBLIC}
OPEN_API_KEY_TMONEY: ${OPEN_API_KEY_TMONEY}

fcm:
  koin:
    url: ${FCM_KOIN_URL}

naver:
  accessKey: ${NAVER_ACCESS_KEY}
  secretKey: ${NAVER_SECRET_KEY}
  sms:
    apiUrl: ${NAVER_SMS_API_URL}
    serviceId: ${NAVER_SMS_SERVICE_ID}
    fromNumber: ${NAVER_SMS_FROM_NUMBER}

cors:
  allowedOrigins: ${CORS_ALLOWED_ORIGINS}

springdoc:
  use-fqn: true

cloudfront:
  distribution-id: ${CLOUDFRONT_DISTRIBUTION_ID}
  region: ${CLOUDFRONT_REGION}

user:
  verification:
    max-verification-count: ${MAX_VERIFICATION_COUNT}

address:
  api:
    url: ${ADDRESS_API_URL}
    key: ${ADDRESS_API_KEY}

toss-payment:
  secret-key: ${TOSS_PAYMENT_SECRET_KEY}
  api-base-url: ${TOSS_PAYMENT_API_BASE_URL}

upstage:
  api-key: ${UPSTAGE_API_KEY:}
  api-base-url: ${UPSTAGE_API_BASE_URL:https://api.upstage.ai/v1}

article:
  ai-summary:
    enabled: ${ARTICLE_AI_SUMMARY_ENABLED:true}
    scheduler-fixed-delay-ms: ${ARTICLE_AI_SUMMARY_SCHEDULER_FIXED_DELAY_MS:60000}
    batch-size: ${ARTICLE_AI_SUMMARY_BATCH_SIZE:5}
    max-retry-count: ${ARTICLE_AI_SUMMARY_MAX_RETRY_COUNT:5}
    max-refinement-retry-count: ${ARTICLE_AI_SUMMARY_MAX_REFINEMENT_RETRY_COUNT:1}
    lock-minutes: ${ARTICLE_AI_SUMMARY_LOCK_MINUTES:30}
    retry-backoff-minutes: ${ARTICLE_AI_SUMMARY_RETRY_BACKOFF_MINUTES:5}
    max-retry-backoff-minutes: ${ARTICLE_AI_SUMMARY_MAX_RETRY_BACKOFF_MINUTES:60}
    max-documents-per-article: ${ARTICLE_AI_SUMMARY_MAX_DOCUMENTS_PER_ARTICLE:3}
    max-document-bytes: ${ARTICLE_AI_SUMMARY_MAX_DOCUMENT_BYTES:10485760}
    document-parse-min-interval-millis: ${ARTICLE_AI_SUMMARY_DOCUMENT_PARSE_MIN_INTERVAL_MILLIS:1000}
    request-timeout-seconds: ${ARTICLE_AI_SUMMARY_REQUEST_TIMEOUT_SECONDS:20}
    model: ${ARTICLE_AI_SUMMARY_MODEL:solar-pro3}
    prompt-version: ${ARTICLE_AI_SUMMARY_PROMPT_VERSION:v9}
    allowed-content-url-prefixes: ${ARTICLE_AI_SUMMARY_ALLOWED_CONTENT_URL_PREFIXES:}
    allowed-document-url-prefixes: ${ARTICLE_AI_SUMMARY_ALLOWED_DOCUMENT_URL_PREFIXES:}

management:
  endpoint:
    health:
      probes:
        enabled: true
