name: KOIN_API_V2 CD (develop)

on:
  push:
    branches:
      - develop

concurrency:
  group: koin-stage-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record start time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Notify Slack - Deploy Start
        env:
          ACTIONS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s HEAD)
          curl -X POST ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \":rocket: *[Develop] 배포 시작*\n• Repo: ${{ github.repository }}\n• Branch: develop\n• Author: @${{ github.actor }}\n• Commit: ${COMMIT_MSG}\n• <${ACTIONS_URL}|Actions 보기>\"
            }"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Build JAR
        run: |
          set -a
          source .env.example
          set +a
          ./gradlew clean build -x test -Dspring.profiles.active=dev

      - name: Prepare staging artifact without embedded secrets
        run: |
          python3 deployment/secrets/sanitize_jar.py deployment/secrets/manifest.json build/libs/KOIN_API_V2.jar build/libs/KOIN_API_V2-clean.jar
          mv build/libs/KOIN_API_V2-clean.jar build/libs/KOIN_API_V2.jar

      - name: Assume staging deploy role
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::965394270103:role/bcsd-koin-stage-github-deploy
          aws-region: ap-northeast-2

      - name: Deploy to develop server through SSM
        run: bash .github/SCRIPT/deploy_via_ssm.sh stage

      - name: Notify Slack - Deploy Result
        if: always()
        env:
          ACTIONS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s HEAD)
          DURATION_SEC=$(( $(date +%s) - START_TIME ))
          DURATION="${DURATION_SEC}초 (약 $(( DURATION_SEC / 60 ))분)"
          if [ "${{ job.status }}" = "success" ]; then
            ICON=":white_check_mark:"
            STATUS="배포 성공"
          else
            ICON=":x:"
            STATUS="배포 실패"
          fi
          curl -X POST ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"${ICON} *[Develop] ${STATUS}*\n• Repo: ${{ github.repository }}\n• Branch: develop\n• Author: @${{ github.actor }}\n• Commit: ${COMMIT_MSG}\n• Duration: ${DURATION}\n• <${ACTIONS_URL}|Actions 보기>\"
            }"
